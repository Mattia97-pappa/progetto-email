name: migrations-service

on:
  push:
    branches: [develop, main]
    paths:
      - 'migrations-service/**'
      - '.github/workflows/migrations-service.yaml'
  pull_request:
    paths:
      - 'migrations-service/**'
      - '.github/workflows/migrations-service.yaml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: migrations-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify